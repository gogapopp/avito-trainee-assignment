version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: assignment-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assignment-api
    ports:
      - "${HTTP_PORT}:8080"
    environment:
      ENV: ${ENV}
      PG_DSN: ${PG_DSN}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_SECRET: ${PASSWORD_SECRET}
      HTTP_PORT: ${HTTP_PORT}
    depends_on:
      - postgres

  migrations:
    image: migrate/migrate:latest
    container_name: assignment-migrations
    depends_on:
      - postgres
    volumes:
      - ./migrations:/migrations
      - ./wait-for-postgres.sh:/wait-for-postgres.sh
    entrypoint: sh -c "/wait-for-postgres.sh postgres 5432 migrate -path /migrations -database 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable' up"
    restart: "no"

volumes:
  postgres-data:
